services:
  postgres:
    image: postgres:18.6-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: proxymaster_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Перебиваем дефолт из config: внутри сети compose хост базы — имя сервиса.
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-change_me}@postgres:5432/app?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
