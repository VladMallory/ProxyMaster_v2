services:
  postgres:
    image: postgres:18.6-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      # Только localhost: база не должна быть доступна из интернета.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: proxymaster_bot
    restart: unless-stopped
    env_file:
      - .env
    labels:
      # Роутер для страницы автоподключения. Домен из .env,
      # Traefik сравнивает Host без порта
      - "traefik.enable=true"
      - "traefik.http.routers.autoconnect.rule=Host(`${AUTO_CONNECT_DOMAIN}`)"
      - "traefik.http.routers.autoconnect.entrypoints=websecure"
      - "traefik.http.routers.autoconnect.tls.certresolver=le"
      - "traefik.http.services.autoconnect.loadbalancer.server.port=8080"
    environment:
      # Перебиваем дефолт из config: внутри сети compose хост базы имя сервиса
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-change_me}@postgres:5432/app?sslmode=disable
    ports:
      # host:container. Приложение внутри слушает WEB_ADDR=:8080.
      - "${WEB_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # websecure публичный TLS вход на нестандартном порту
      - --entrypoints.websecure.address=:444
      # web только для ACME HTTP-01: наружу не публикуется, nginx
      # проксирует сюда /.well-known/acme-challenge/ с 80 порта
      - --entrypoints.web.address=:8080
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "444:444"
      - "127.0.0.1:8090:8080"
    volumes:
      # Docker provider смотрит на метки контейнеров
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Сертификаты и аккаунт ACME переживают пересоздание контейнера
      - traefik_acme:/letsencrypt

volumes:
  postgres_data:
  traefik_acme:
